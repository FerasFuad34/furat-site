# Render Blueprint — نشر بضغطة زر على Render.com
# من لوحة Render: New → Blueprint → اختر المستودع الذي يحتوي هذا الملف
services:
  - type: web
    name: furat-alhalwa
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      # رمز احتياطي للدخول لو احتجته (الرمز الأساسي يتغير من داخل اللوحة)
      - key: FH_PIN
        value: 1234
